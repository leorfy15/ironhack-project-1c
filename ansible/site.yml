---
- name: Configure Bastion
  hosts: bastion
  become: 'yes'
  tasks:
    - dnf:
        name: docker
        state: present
      name: Install Docker
    - get_url:
        dest: /usr/local/bin/docker-compose
        mode: '0755'
        url: https://github.com/docker/compose/releases/latest/download/docker-compose-linux-x86_64
      name: Install docker-compose
    - name: Start Docker
      service:
        enabled: 'yes'
        name: docker
        state: started
    - dnf:
        name: git
        state: present
      name: Install Git
    - copy:
        dest: /home/ec2-user/docker-compose.front.yml
        group: ec2-user
        mode: '0644'
        owner: ec2-user
        src: files/docker-compose.front.yml
      name: Copy front compose file
    - command: docker-compose -f /home/ec2-user/docker-compose.front.yml up -d
      name: Start front containers
- name: Configure Frontend
  hosts: frontend
  become: yes

  tasks:
    - name: Install Docker
      dnf:
        name: docker
        state: present

    - name: Install docker-compose
      get_url:
        url: https://github.com/docker/compose/releases/latest/download/docker-compose-linux-x86_64
        dest: /usr/local/bin/docker-compose
        mode: '0755'

    - name: Start Docker
      service:
        name: docker
        state: started
        enabled: yes
    - name: Copy front compose file
      copy:
        src: files/docker-compose.front.yml
        dest: /home/ec2-user/docker-compose.front.yml
        owner: ec2-user
        group: ec2-user
        mode: '0644'

    - name: Start front containers
      command: docker-compose -f /home/ec2-user/docker-compose.front.yml up -d

- become: 'yes'
  hosts: worker
  name: Configure Worker / Redis
  tasks:
    - dnf:
        name: docker
        state: present
      name: Install Docker
    - get_url:
        dest: /usr/local/bin/docker-compose
        mode: '0755'
        url: https://github.com/docker/compose/releases/latest/download/docker-compose-linux-x86_64
      name: Install docker-compose
    - name: Start Docker
      service:
        enabled: 'yes'
        name: docker
        state: started
    - copy:
        dest: /home/ec2-user/docker-compose.worker.yml
        group: ec2-user
        mode: '0644'
        owner: ec2-user
        src: files/docker-compose.worker.yml
      name: Copy worker compose file
    - command: docker-compose -f /home/ec2-user/docker-compose.worker.yml up -d
      name: Start worker containers
- become: 'yes'
  hosts: database
  name: Configure Database
  tasks:
    - dnf:
        name: postgresql15-server
        state: present
      name: Install PostgreSQL server
    - name: Initialize PostgreSQL
      command: postgresql-setup --initdb
      args:
        creates: /var/lib/pgsql/data/PG_VERSION

    - name: Start PostgreSQL
      service:
        name: postgresql
        state: started
        enabled: yes

    - name: Set postgres password
      shell: |
        sudo -u postgres psql -c "ALTER USER postgres WITH PASSWORD 'postgres';"
    - name: Start PostgreSQL
      service:
        enabled: 'yes'
        name: postgresql
        state: started
    - lineinfile:
        line: listen_addresses = '*'
        path: /var/lib/pgsql/data/postgresql.conf
        regexp: ^#?listen_addresses
      name: Allow PostgreSQL remote connections
    - lineinfile:
        line: wal_level = replica
        path: /var/lib/pgsql/data/postgresql.conf
        regexp: ^#?wal_level
      name: Set wal_level
    - lineinfile:
        line: max_wal_senders = 10
        path: /var/lib/pgsql/data/postgresql.conf
        regexp: ^#?max_wal_senders
      name: Set max_wal_senders
    - lineinfile:
        line: max_replication_slots = 10
        path: /var/lib/pgsql/data/postgresql.conf
        regexp: ^#?max_replication_slots
      name: Set max_replication_slots
    - lineinfile:
        line: hot_standby = on
        path: /var/lib/pgsql/data/postgresql.conf
        regexp: ^#?hot_standby
      name: Set hot_standby
    - lineinfile:
        line: host all all 10.0.0.0/16 md5
        path: /var/lib/pgsql/data/pg_hba.conf
      name: Allow VPC clients
    - lineinfile:
        path: /var/lib/pgsql/data/pg_hba.conf
        line: "host replication replicator 10.0.12.203/32 md5"
      name: Allow replica access
    - name: Create replication user
      shell: |
         sudo -u postgres psql -tc "SELECT 1 FROM pg_roles WHERE rolname='replicator'" | grep -q 1 || \
         sudo -u postgres psql -c "CREATE ROLE replicator WITH REPLICATION LOGIN PASSWORD 'StrongPassword123!';"

    - name: Restart PostgreSQL
      service:
        name: postgresql
        state: restarted
- become: 'yes'
  hosts: database_secondary
  name: Configure Replica Database
  tasks:
    - dnf:
        name: postgresql15-server
        state: present
      name: Install PostgreSQL server
    - name: Check if replica already exists
      register: replica_exists
      stat:
        path: /var/lib/pgsql/data/standby.signal
    - name: Initialize PostgreSQL
      command: postgresql-setup --initdb
      args:
        creates: /var/lib/pgsql/data/PG_VERSION
    - name: Start PostgreSQL
      service:
        enabled: 'yes'
        name: postgresql
        state: started