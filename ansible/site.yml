---
- name: Configure Bastion
  hosts: bastion
  become: 'yes'
  tasks:
    - dnf:
        name: docker
        state: present
      name: Install Docker
    - get_url:
        dest: /usr/local/bin/docker-compose
        mode: '0755'
        url: https://github.com/docker/compose/releases/latest/download/docker-compose-linux-x86_64
      name: Install docker-compose
    - name: Start Docker
      service:
        enabled: 'yes'
        name: docker
        state: started
    - dnf:
        name: git
        state: present
      name: Install Git
    - copy:
        dest: /home/ec2-user/docker-compose.front.yml
        group: ec2-user
        mode: '0644'
        owner: ec2-user
        src: files/docker-compose.front.yml
      name: Copy front compose file
    - command: docker-compose -f /home/ec2-user/docker-compose.front.yml up -d
      name: Start front containers
- name: Configure Frontend
  hosts: frontend
  become: yes

  tasks:
    - name: Install Docker
      dnf:
        name: docker
        state: present

    - name: Install docker-compose
      get_url:
        url: https://github.com/docker/compose/releases/latest/download/docker-compose-linux-x86_64
        dest: /usr/local/bin/docker-compose
        mode: '0755'

    - name: Start Docker
      service:
        name: docker
        state: started
        enabled: yes
    - name: Copy front compose file
      copy:
        src: files/docker-compose.front.yml
        dest: /home/ec2-user/docker-compose.front.yml
        owner: ec2-user
        group: ec2-user
        mode: '0644'

    - name: Start front containers
      command: docker-compose -f /home/ec2-user/docker-compose.front.yml up -d

- become: 'yes'
  hosts: worker
  name: Configure Worker / Redis
  tasks:
    - dnf:
        name: docker
        state: present
      name: Install Docker
    - get_url:
        dest: /usr/local/bin/docker-compose
        mode: '0755'
        url: https://github.com/docker/compose/releases/latest/download/docker-compose-linux-x86_64
      name: Install docker-compose
    - name: Start Docker
      service:
        enabled: 'yes'
        name: docker
        state: started
    - copy:
        dest: /home/ec2-user/docker-compose.worker.yml
        group: ec2-user
        mode: '0644'
        owner: ec2-user
        src: files/docker-compose.worker.yml
      name: Copy worker compose file
    - command: docker-compose -f /home/ec2-user/docker-compose.worker.yml up -d
      name: Start worker containers
- become: 'yes'
  hosts: database
  name: Configure Database
  tasks:
    - dnf:
        name: postgresql15-server
        state: present
      name: Install PostgreSQL server
    - name: Initialize PostgreSQL
      command: postgresql-setup --initdb
      args:
        creates: /var/lib/pgsql/data/PG_VERSION

    - name: Start PostgreSQL
      service:
        name: postgresql
        state: started
        enabled: yes

    - name: Set postgres password
      shell: |
        sudo -u postgres psql -c "ALTER USER postgres WITH PASSWORD 'postgres';"

- name: Configure Replica Database
  hosts: database_secondary
  become: yes

  tasks:

    - name: Install PostgreSQL server
      dnf:
        name: postgresql15-server
        state: present

    - name: Check if replica already exists
      stat:
        path: /var/lib/pgsql/data/standby.signal
      register: replica_exists

    - name: Stop PostgreSQL
      service:
        name: postgresql
        state: stopped
      when: not replica_exists.stat.exists

    - name: Remove old database
      file:
        path: /var/lib/pgsql/data
        state: absent
      when: not replica_exists.stat.exists

    - name: Recreate data directory
      file:
        path: /var/lib/pgsql/data
        state: directory
        owner: postgres
        group: postgres
        mode: '0700'
      when: not replica_exists.stat.exists

    - name: Create replica from primary
      shell: |
        sudo -u postgres bash -c '
        PGPASSWORD=StrongPassword123! pg_basebackup \
        -h {{ primary_db_host }} \
        -D /var/lib/pgsql/data \
        -U replicator \
        -P \
        -R'
      when: not replica_exists.stat.exists

    - name: Start PostgreSQL
      service:
        name: postgresql
        state: started
        enabled: yes

    - name: Verify standby file exists
      stat:
        path: /var/lib/pgsql/data/standby.signal
      register: standby_file

    - name: Fail if replica was not created
      fail:
        msg: "Replica setup failed"
      when: not standby_file.stat.exists